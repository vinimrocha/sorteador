<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1C1C1C">
    <meta property="og:title" content="Sorteador de Times" />
    <meta property="og:description" content="Sorteador de times para a sua pelada ⚽" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vinimrocha.github.io/sorteador/" />
    <meta property="og:image" content="https://vinimrocha.github.io/sorteador/sorteador-logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sorteador de Times" />
    <meta name="twitter:description" content="Sorteador de times para a sua pelada ⚽" />
    <meta name="twitter:image" content="https://vinimrocha.github.io/sorteador/sorteador-logo.png" />
    <meta name="description" content="Sorteador de times para suas peladas" />
    <title>Sorteador de Times</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="header">
    <div class="header-brand">
        <img src="sorteador-logo.png" alt="Sorteador de Times" class="header-logo" id="logoGrupo" width="64" height="64">
        <div class="header-text">
            <h1 id="nomeGrupo">Sorteador de Times</h1>
            <p id="subGrupo">Sorteie os times da sua pelada</p>
        </div>
    </div>
    <div id="groupSelector"></div>
</header>
<div id="loginSection"></div>
<div id="adminSection" style="display:none;">
    <div class="admin-bar">
        <span id="userInfo" class="admin-user"></span>
        <div class="admin-actions">
            <button id="btnManageGroup" class="btn-secondary btn-compact" onclick="showManageGroup()" style="display:none;">Gerenciar grupo</button>
            <button id="btnLogout" class="btn-secondary btn-compact" onclick="logout()">Sair</button>
        </div>
    </div>
    <div id="pendingPanel"></div>
</div>
<main class="container" id="mainApp">
    <section class="card card-players">
        <div class="card-header-row">
            <h2>Jogadores Presentes</h2>
            <div id="contadorSelecionados" class="contador">0 selecionados</div>
        </div>
        <div id="listaJogadores" class="lista-jogadores"></div>
    </section>
    <section class="card card-config">
        <h2>Configuração</h2>
        <p class="config-label">Jogadores por time</p>
        <div class="radio-group">
            <label class="radio-option"><input type="radio" name="jogadoresPorTime" value="4"><span class="radio-value">4</span><span class="radio-hint">por time</span></label>
            <label class="radio-option"><input type="radio" name="jogadoresPorTime" value="5"><span class="radio-value">5</span><span class="radio-hint">por time</span></label>
            <label class="radio-option"><input type="radio" name="jogadoresPorTime" value="6" checked><span class="radio-value">6</span><span class="radio-hint">por time</span></label>
        </div>
        <div class="sort-actions">
            <button id="btnSortear" class="btn-primary" onclick="realizarSorteio()">Sortear Times</button>
            <button id="btnDesmarcar" class="btn-secondary btn-compact" onclick="desmarcarTodos()">Desmarcar Todos</button>
        </div>
    </section>
    <details class="card card-collapsible">
        <summary>Adicionar Convidado</summary>
        <div class="card-collapsible-body">
            <div class="form-group"><label for="convidadoNome">Nome</label><input type="text" id="convidadoNome" placeholder="Nome do convidado" autocomplete="off"></div>
            <div class="form-row">
                <div class="form-group"><label for="convidadoTipo">Tipo</label><select id="convidadoTipo"><option value="linha">Linha</option><option value="goleiro">Goleiro</option></select></div>
                <div class="form-group" id="categoriaContainer"><label for="convidadoCategoria">Categoria</label><select id="convidadoCategoria"><option value="0">0</option><option value="0.5">0.5</option><option value="1">1</option><option value="1.5">1.5</option><option value="2">2</option><option value="2.5">2.5</option><option value="3">3</option><option value="3.5">3.5</option><option value="4">4</option><option value="4.5">4.5</option><option value="5">5</option></select></div>
            </div>
            <div class="form-group form-check"><label><input type="checkbox" id="convidadoMenina"> Menina (times separados)</label></div>
            <button id="btnAdicionar" type="button" onclick="adicionarConvidado()">Adicionar Convidado</button>
        </div>
    </details>
    <section id="resultadoContainer" class="resultado-container">
        <div class="acoes-resultado">
            <button id="btnResortear" class="btn-secondary" onclick="realizarSorteio()" style="display:none;">Sortear Novamente</button>
            <button id="btnCompartilhar" class="btn-success" onclick="compartilharImagem()" style="display:none;">Compartilhar Imagem</button>
        </div>
        <div id="resultado"></div>
    </section>
</main>
<footer class="site-footer">
    <p>Desenvolvido por <a href="https://www.linkedin.com/in/vinimartins/" target="_blank" rel="noopener noreferrer">Vinicios Martins</a></p>
</footer>
<script src="js/auth.js"></script>
</body>
</html>
